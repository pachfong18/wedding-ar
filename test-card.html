<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Card แนวนอน สำหรับทดสอบ WebAR | Wedding Hologram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0f111a;
      color: #fff;
      font-family: 'Prompt', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #1a1c29;
      border: 1px solid rgba(247, 215, 148, 0.35);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 860px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }
    h1 {
      font-family: 'Alex Brush', cursive;
      color: #f7d794;
      font-size: 46px;
      margin: 0 0 8px;
      font-weight: normal;
      text-shadow: 0 0 20px rgba(247, 215, 148, 0.3);
    }
    p {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(247, 215, 148, 0.15);
      color: #f7d794;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
      border: 1px solid rgba(247, 215, 148, 0.35);
    }
    
    /* Horizontal Landscape Card Frame */
    .card-outer-frame {
      width: 680px;
      max-width: 100%;
      margin: 10px auto 20px;
      background: linear-gradient(135deg, #24160c 0%, #150f1d 100%);
      border: 3px solid #f7d794;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 0 35px rgba(247, 215, 148, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-header-label {
      font-family: 'Alex Brush', cursive;
      font-size: 34px;
      color: #f7d794;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .card-footer-label {
      margin-top: 14px;
      font-size: 12px;
      color: #cbd5e1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Target Image displayed explicitly in Horizontal Landscape (674x372) */
    .inner-target-wrapper {
      border: 2px solid rgba(247, 215, 148, 0.6);
      border-radius: 10px;
      overflow: hidden;
      display: inline-block;
      background: #0094c6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .inner-target-wrapper img {
      width: 580px;
      max-width: 100%;
      height: auto;
      display: block;
      image-orientation: none; /* Ignore any residual orientation */
    }

    .btn-action {
      background: rgba(247, 215, 148, 0.15);
      border: 1px solid rgba(247, 215, 148, 0.4);
      color: #f7d794;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 5px;
    }
    .btn-action:hover {
      background: rgba(247, 215, 148, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Wedding Target Card (แนวนอน)</h1>
    <div class="badge">🎯 การ์ดแต่งงานแนวนอน สำหรับส่องด้วยกล้องมือถือ</div>
    <p>เปิดหน้าเว็บ WebAR บนมือถือ แล้วส่องมาที่การ์ดแนวนอนด้านล่างนี้ครับ</p>

    <!-- Landscape Wedding Card Target -->
    <div class="card-outer-frame" id="cardFrame">
      <div class="card-header-label">Wedding Invitation - Save The Date</div>
      
      <div class="inner-target-wrapper">
        <img src="./assets/card.png" alt="Target Wedding Card แนวนอน">
      </div>

      <div class="card-footer-label">Together Forever • Landscape Mode</div>
    </div>

    <div>
      <button class="btn-action" onclick="toggleFullscreen()">⛶ ขยายการ์ดเต็มจอ</button>
    </div>
  </div>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    }
  </script>
</body>
</html>
